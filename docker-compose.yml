services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: wud_szczecin_web:dev
    container_name: wud_szczecin_web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true

  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    image: wud_szczecin_api:dev
    container_name: wud_szczecin_api
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/src
      - ./data:/data:ro
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - DB_PATH=/data/filharmonia.sqlite
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  node_modules:
  next_cache:
  go_mod_cache:
  go_build_cache:
